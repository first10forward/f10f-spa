<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>First 10 Forward</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
<style>

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

/* ── DECK ─────────────────────────────────────────────── */

#deck { position: fixed; inset: 0; }

.slide {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 1.3s ease;
  pointer-events: none;
  z-index: 0;
}

.slide.active {
  opacity: 1;
  pointer-events: auto;
  z-index: 1;
}

/* Blurred backdrop — fills letterbox areas on all slides */
.bg-blur {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  filter: blur(28px) brightness(0.28) saturate(0.45);
}

/* Sharp image — always contained so nothing is cropped */
.bg {
  position: absolute;
  inset: 0;
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
}

.slide.active .bg:not(.no-kb) {
  animation: kb 10s ease-out both;
}

@keyframes kb {
  from { transform: scale(1.04); }
  to   { transform: scale(1.00); }
}

/* Cinematic gradient — heavier at bottom for text legibility */
.overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    165deg,
    rgba(0,0,0,0.08) 0%,
    rgba(0,0,0,0.25) 35%,
    rgba(0,0,0,0.75) 100%
  );
}

/* Ghost year watermark */
.ghost-year {
  position: absolute;
  top: 48%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-family: 'Playfair Display', Georgia, serif;
  font-weight: 400;
  font-size: clamp(8rem, 24vw, 20rem);
  color: rgba(255,255,255,0.055);
  letter-spacing: 0.04em;
  white-space: nowrap;
  pointer-events: none;
  user-select: none;
  line-height: 1;
}

/* ── TEXT CONTENT ──────────────────────────────────────── */

.content {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  padding: 0 13% 9%;
  text-align: center;
}

/* Section label — gold, tracked caps */
.label {
  font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
  font-weight: 400;
  font-size: clamp(0.58rem, 1.1vw, 0.72rem);
  letter-spacing: 0.38em;
  text-transform: uppercase;
  color: rgba(212, 172, 46, 0.92);
  margin-bottom: 1.3rem;
  opacity: 0;
  transform: translateY(10px);
}

/* Main narrator quote */
.quote {
  font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
  font-weight: 400;
  font-size: clamp(1.45rem, 2.7vw, 2.55rem);
  line-height: 1.54;
  color: #fff;
  max-width: 880px;
  opacity: 0;
  transform: translateY(12px);
}

.quote em  { font-style: italic; }
.quote strong { font-weight: 600; }

/* Category sub-label (impact slides) */
.category {
  font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
  font-weight: 300;
  font-size: clamp(0.62rem, 1.2vw, 0.82rem);
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.42);
  margin-top: 1.4rem;
  opacity: 0;
  transform: translateY(8px);
}

/* Staggered reveal on activation */
.slide.active .label    { opacity: 1; transform: none; transition: opacity 0.9s ease 0.45s, transform 0.9s ease 0.45s; }
.slide.active .quote    { opacity: 1; transform: none; transition: opacity 0.9s ease 0.80s, transform 0.9s ease 0.80s; }
.slide.active .category { opacity: 1; transform: none; transition: opacity 0.9s ease 1.15s, transform 0.9s ease 1.15s; }

/* ── END CARD ──────────────────────────────────────────── */

.endcard-bg {
  position: absolute;
  inset: 0;
  background: #0c1929;
}

.endcard-inner {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 4rem;
}

.endcard-logo {
  width: clamp(220px, 40vw, 400px);
  opacity: 0;
  transform: translateY(22px);
}

.endcard-rule {
  width: 54px;
  height: 1px;
  background: rgba(212,172,46,0.45);
  margin: 2.8rem auto;
  opacity: 0;
}

.endcard-tagline {
  font-family: 'Playfair Display', Georgia, serif;
  font-style: italic;
  font-size: clamp(1rem, 2.2vw, 1.45rem);
  color: rgba(255,255,255,0.5);
  letter-spacing: 0.05em;
  opacity: 0;
  transform: translateY(10px);
}

/* End card reveal — slower, more deliberate */
.endcard-cta {
  display: inline-block;
  margin-top: 2.4rem;
  font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
  font-weight: 400;
  font-size: clamp(0.65rem, 1.2vw, 0.8rem);
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.6);
  text-decoration: none;
  border: 1px solid rgba(255,255,255,0.25);
  padding: 0.7rem 1.8rem;
  transition: color 0.2s, border-color 0.2s, background 0.2s;
  opacity: 0;
  transform: translateY(8px);
}
.endcard-cta:hover {
  color: #fff;
  border-color: rgba(255,255,255,0.7);
  background: rgba(255,255,255,0.06);
}

.slide.active .endcard-logo    { opacity: 1; transform: none; transition: opacity 1.6s ease 0.6s,  transform 1.6s ease 0.6s; }
.slide.active .endcard-rule    { opacity: 1;                  transition: opacity 1.2s ease 1.4s; }
.slide.active .endcard-tagline { opacity: 1; transform: none; transition: opacity 1.2s ease 1.8s,  transform 1.2s ease 1.8s; }
.slide.active .endcard-cta     { opacity: 1; transform: none; transition: opacity 1.2s ease 2.2s,  transform 1.2s ease 2.2s; }

/* ── CHROME: NAV, DOTS, COUNTER ────────────────────────── */

.nav {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  z-index: 10;
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.14);
  background: rgba(255,255,255,0.06);
  color: rgba(255,255,255,0.6);
  font-size: 1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  outline: none;
  opacity: 0;
  transition: opacity 0.35s, background 0.2s, color 0.2s;
}
body:hover .nav        { opacity: 1; }
.nav:hover             { background: rgba(255,255,255,0.18); color: #fff; }
.nav:disabled          { opacity: 0 !important; pointer-events: none; }
#prev                  { left:  1.4rem; }
#next                  { right: 1.4rem; }

#dots {
  position: fixed;
  bottom: 1.8rem;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 7px;
  z-index: 10;
  opacity: 0;
  transition: opacity 0.35s;
}
body:hover #dots { opacity: 1; }

.dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: rgba(255,255,255,0.28);
  cursor: pointer;
  transition: background 0.3s, transform 0.3s;
  flex-shrink: 0;
}
.dot.on {
  background: rgba(255,255,255,0.88);
  transform: scale(1.5);
}

#counter {
  position: fixed;
  bottom: 1.6rem;
  right: 1.6rem;
  font-family: 'Montserrat', sans-serif;
  font-size: 0.58rem;
  letter-spacing: 0.22em;
  color: rgba(255,255,255,0.22);
  z-index: 10;
  opacity: 0;
  transition: opacity 0.35s;
}
body:hover #counter { opacity: 1; }

#playbtn {
  position: fixed;
  top: 1.4rem;
  right: 1.4rem;
  z-index: 10;
  background: transparent;
  border: 1px solid rgba(255,255,255,0.14);
  color: rgba(255,255,255,0.38);
  font-family: 'Montserrat', sans-serif;
  font-size: 0.58rem;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  padding: 0.42rem 0.85rem;
  cursor: pointer;
  outline: none;
  opacity: 0;
  transition: opacity 0.35s, color 0.2s, border-color 0.2s;
}
body:hover #playbtn   { opacity: 1; }
#playbtn:hover        { color: #fff; border-color: rgba(255,255,255,0.45); }
#playbtn.on           { color: rgba(212,172,46,0.85); border-color: rgba(212,172,46,0.35); }

/* Hint shown at start */
#hint {
  position: fixed;
  bottom: 3.8rem;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'Montserrat', sans-serif;
  font-size: 0.58rem;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.3);
  z-index: 10;
  white-space: nowrap;
  animation: hintFade 4s ease 2s forwards;
}
@keyframes hintFade {
  0%   { opacity: 1; }
  70%  { opacity: 1; }
  100% { opacity: 0; pointer-events: none; }
}

</style>
</head>
<body>

<div id="deck"></div>

<button class="nav" id="prev" aria-label="Previous">&#8592;</button>
<button class="nav" id="next" aria-label="Next">&#8594;</button>
<div id="dots"></div>
<div id="counter"></div>
<button id="playbtn">&#9654;&nbsp;Play</button>
<div id="hint">Click or press &rarr; to advance</div>

<script>
const SLIDES = [
  // 1 — Establishing (no text, short hold, no zoom)
  {
    img: 'images/01-legacy/aerial.jpeg',
    delay: 2500,
    static: true,
  },
  // 2 — In 1974
  {
    img: 'images/01-legacy/nancy-wagner-1974.jpg',
    year: '1974',
    label: 'OPENING · LEGACY',
    quote: 'In 1974, fifteen women arrived at the United States Merchant Marine Academy at Kings Point.',
  },
  // 3 — First women
  {
    img: 'images/01-legacy/women-in-rifle-drill.png',
    quote: 'They were the first women admitted to a federal service academy&mdash;a full two years before any other academy followed.',
  },
  // 4 — No roadmap
  {
    img: 'images/01-legacy/war-memorial.jpg',
    quote: 'They didn\'t have a roadmap.<br><em>They became one.</em>',
  },
  // 5 — Responsibility
  {
    img: 'images/02-responsibility/watertight-door-open.jpg',
    label: 'RESPONSIBILITY',
    quote: 'They understood something important from the very beginning.',
  },
  // 6 — Open the doors
  {
    img: 'images/02-responsibility/gangway.jpg',
    quote: 'That it wasn\'t their job to just open doors&hellip;<br>but to make sure they stayed open for those who followed.',
  },
  // 7 — Leadership today
  {
    img: 'images/03-leadership/susan-on-bridge.png',
    label: 'TODAY · LEADERSHIP CONTINUES',
    quote: 'That belief still defines Kings Point women today.',
  },
  // 8 — Ships and jets
  {
    img: 'images/03-leadership/woman-pilot-in-cockpit.jpg',
    quote: 'From ships at sea to Navy fighter jets in the sky&hellip;',
  },
  // 9 — Everywhere
  {
    img: 'images/03-leadership/shipyard-president-in-hardhat.jpg',
    quote: '&hellip;from shipyards and construction sites to classrooms, boardrooms, and communities across the country&mdash;Kings Point women continue to lead the way.',
  },
  // 10 — Mission intro
  {
    img: 'images/04-mission/pitch.jpg',
    label: 'FIRST 10 FORWARD · THE MISSION',
    quote: '<em>First 10 Forward</em> was created to turn that responsibility into action.',
  },
  // 11 — Collective commitment
  {
    img: 'images/04-mission/21_group_2.jpg',
    quote: 'A collective commitment by alumnae to pay forward their success&mdash;by supporting organizations that expand opportunity for women and girls pursuing bold paths.',
  },
  // 12 — Impact: Trades
  {
    img: 'images/05-impact/mowit-women-at-work.jpg',
    label: 'IMPACT · THE GRANTEES',
    quote: 'Women building their future&mdash;in the trades, in the yards, with their hands.',
    category: 'TRADES & CONSTRUCTION',
  },
  // 13 — Impact: Maritime
  {
    img: 'images/05-impact/sea-sisters.jpg',
    quote: 'Women at sea&mdash;carrying the tradition forward, one voyage at a time.',
    category: 'MARITIME EDUCATION',
  },
  // 14 — Impact: STEM
  {
    img: 'images/05-impact/stem-girls.jpg',
    quote: 'Girls in STEM&mdash;discovering what\'s possible when someone believes in them.',
    category: 'STEM & YOUTH PROGRAMS',
  },
  // 15 — Impact: Offshore & Mentorship
  {
    img: 'images/05-impact/two-women-on-deck.jpg',
    quote: 'Women offshore, women together&mdash;the surest way to keep a door open.',
    category: 'WOMEN OFFSHORE · MENTORSHIP',
  },
  // 16 — Ripple effect / check presentation
  {
    img: 'images/05-impact/25-grantee.jpeg',
    label: 'THE RIPPLE EFFECT',
    quote: 'The impact multiplies. Each woman who breaks through reaches back&mdash;and lifts others forward.',
  },
  // 17 — Closing callback
  {
    img: 'images/02-responsibility/tanker-sunset.jpg',
    label: 'CLOSING',
    quote: 'Because opening doors matters.<br>But <em>keeping them open</em>&mdash;that\'s the work of a lifetime.',
  },
  // 18 — End card
  { endcard: true },
];

const deck    = document.getElementById('deck');
const dotsEl  = document.getElementById('dots');
const counter = document.getElementById('counter');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const playBtn = document.getElementById('playbtn');

let cur   = 0;
let timer = null;
const DELAY = 8000;

// Build slides
SLIDES.forEach((s, i) => {
  const el = document.createElement('div');
  el.className = 'slide';

  if (s.endcard) {
    el.innerHTML = `
      <div class="endcard-bg"></div>
      <div class="endcard-inner">
        <img class="endcard-logo" src="images/06-closing/f10f-logo.png" alt="First 10 Forward">
        <div class="endcard-rule"></div>
        <p class="endcard-tagline">Opening doors. Keeping them open.</p>
        <a class="endcard-cta" href="https://first10forward.org/mission" target="_blank">Learn More</a>
      </div>`;
  } else {
    const yearEl  = s.year     ? `<div class="ghost-year">${s.year}</div>` : '';
    const labelEl = s.label    ? `<p class="label">${s.label}</p>`         : '';
    const quoteEl = s.quote    ? `<p class="quote">${s.quote}</p>`         : '';
    const catEl   = s.category ? `<p class="category">${s.category}</p>`   : '';

    el.innerHTML = `
      <div class="bg-blur" style="background-image:url('${s.img}')"></div>
      <div class="bg${s.static ? ' no-kb' : ''}" style="background-image:url('${s.img}')"></div>
      <div class="overlay"></div>
      ${yearEl}
      <div class="content">${labelEl}${quoteEl}${catEl}</div>`;
  }

  deck.appendChild(el);

  // Dot
  const dot = document.createElement('div');
  dot.className = 'dot';
  dot.addEventListener('click', () => { stopAuto(); go(i); });
  dotsEl.appendChild(dot);
});

// Navigation
function go(n) {
  if (n < 0 || n >= SLIDES.length) return;

  const slides = deck.querySelectorAll('.slide');
  const dots   = dotsEl.querySelectorAll('.dot');

  slides[cur].classList.remove('active');
  dots[cur].classList.remove('on');

  cur = n;

  // Reset Ken Burns so it restarts on the incoming slide
  const incoming = slides[cur];
  const bg = incoming.querySelector('.bg');
  if (bg) { bg.style.animation = 'none'; void bg.offsetWidth; bg.style.animation = ''; }

  incoming.classList.add('active');
  dots[cur].classList.add('on');

  counter.textContent    = `${cur + 1} / ${SLIDES.length}`;
  prevBtn.disabled       = cur === 0;
  nextBtn.disabled       = cur === SLIDES.length - 1;
  if (!timer) updatePlayBtn();
}

function next() { if (cur < SLIDES.length - 1) go(cur + 1); else stopAuto(); }
function prev() { go(cur - 1); }

prevBtn.addEventListener('click', () => { stopAuto(); prev(); });
nextBtn.addEventListener('click', () => { stopAuto(); next(); });

// Click slide area to advance
deck.addEventListener('click', () => { stopAuto(); next(); });

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ')  { stopAuto(); next(); e.preventDefault(); }
  if (e.key === 'ArrowLeft')                    { stopAuto(); prev(); e.preventDefault(); }
  if (e.key === 'p' || e.key === 'P')           { toggleAuto(); }
  if (e.key === 'f' || e.key === 'F')           { toggleFullscreen(); }
});

// Auto-play — per-slide delay support
function scheduleNext() {
  const delay = SLIDES[cur].delay ?? DELAY;
  timer = setTimeout(() => { next(); if (timer !== null) scheduleNext(); }, delay);
}
function updatePlayBtn() {
  if (timer) {
    playBtn.classList.add('on');
    playBtn.innerHTML = '&#9646;&#9646;&nbsp;Pause';
  } else if (cur === SLIDES.length - 1) {
    playBtn.classList.remove('on');
    playBtn.innerHTML = '&#8635;&nbsp;Restart';
  } else {
    playBtn.classList.remove('on');
    playBtn.innerHTML = '&#9654;&nbsp;Play';
  }
}
function startAuto() {
  scheduleNext();
  updatePlayBtn();
}
function stopAuto() {
  clearTimeout(timer); timer = null;
  updatePlayBtn();
}
function toggleAuto() {
  if (timer) {
    stopAuto();
  } else if (cur === SLIDES.length - 1) {
    go(0);
    startAuto();
  } else {
    startAuto();
  }
}
playBtn.addEventListener('click', toggleAuto);

// Fullscreen
function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen().catch(() => {});
  }
}

// Preload images
SLIDES.forEach(s => { if (s.img) { const img = new Image(); img.src = s.img; } });

// Init
go(0);
startAuto();
</script>
</body>
</html>
